services:
  - type: web
    name: miele-backend-staging
    env: python
    plan: free
    region: oregon
    branch: develop

    buildCommand: |
      pip install -r requirements/requirements.txt
      cd backend
      python manage.py collectstatic --noinput

    startCommand: |
      cd backend && python manage.py migrate && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings.prod

      - key: DEBUG
        value: "false"
      - key: TIME_ZONE
        value: America/Sao_Paulo
      - key: LANGUAGE_CODE
        value: pt-br

      - key: SIMPLEJWT_ACCESS_MIN
        value: "15"
      - key: SIMPLEJWT_REFRESH_DAYS
        value: "14"

      - key: CORS_ALLOW_ALL_ORIGINS
        value: "true"
      - key: ALLOWED_HOSTS
        value: "*"

      - key: DATABASE_URL
        fromDatabase:
          name: miele-staging-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: GDRIVE_CLIENT_ID
        sync: false
      - key: GDRIVE_CLIENT_SECRET
        sync: false
      - key: GDRIVE_REFRESH_TOKEN
        sync: false
      - key: GDRIVE_CLIENTS_FOLDER_ID
        sync: false
      - key: GDRIVE_PERDCOMPS_FOLDER_ID
        sync: false

      - key: GDRIVE_MAX_FILE_SIZE
        value: "104857600"
      - key: GDRIVE_API_TIMEOUT
        value: "30"
      - key: GDRIVE_REQUESTS_PER_MINUTE
        value: "600"
      - key: GDRIVE_SYNC_VERIFICATION_INTERVAL
        value: "24"

databases:
  - name: miele-staging-db
    plan: free
    databaseName: miele_staging_db
    user: miele_staging
    region: oregon
