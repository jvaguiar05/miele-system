services:
  # ===== Aplicação Django (Web Service) =====
  - type: web
    name: miele-backend-staging
    env: python
    plan: free
    region: oregon
    branch: develop

    # Instala as dependências e roda as migrações
    buildCommand: |
      pip install -r requirements/requirements.txt
      cd backend
      python manage.py collectstatic --noinput
      python manage.py migrate

    # Inicia o servidor (Gunicorn)
    startCommand: "cd backend && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT"

    envVars:
      # --- AQUI ESTÁ A MÁGICA QUE FALTAVA ---
      # Isso avisa o Django para carregar o arquivo prod.py
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings.prod

      # --- Configurações Gerais ---
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DEBUG
        value: "false"
      - key: TIME_ZONE
        value: America/Sao_Paulo
      - key: LANGUAGE_CODE
        value: pt-br

      # --- JWT ---
      - key: SIMPLEJWT_ACCESS_MIN
        value: "15"
      - key: SIMPLEJWT_REFRESH_DAYS
        value: "14"

      # --- CORS / Hosts ---
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "true"
      - key: ALLOWED_HOSTS
        value: "*"

      # --- Banco de Dados (Automático) ---
      - key: DATABASE_URL
        fromDatabase:
          name: miele-staging-db
          property: connectionString

      # --- SEGREDOS (Preencher no Painel do Render) ---
      - key: SECRET_KEY
        generateValue: true

      # Google Drive - Segredos (sync: false = preencher manualmente no site)
      - key: GDRIVE_CLIENT_ID
        sync: false
      - key: GDRIVE_CLIENT_SECRET
        sync: false
      - key: GDRIVE_REFRESH_TOKEN
        sync: false

      # Google Drive - IDs de Pasta
      - key: GDRIVE_CLIENTS_FOLDER_ID
        sync: false
      - key: GDRIVE_PERDCOMPS_FOLDER_ID
        sync: false

      # Google Drive - Configs
      - key: GDRIVE_MAX_FILE_SIZE
        value: "104857600"
      - key: GDRIVE_API_TIMEOUT
        value: "30"
      - key: GDRIVE_REQUESTS_PER_MINUTE
        value: "600"
      - key: GDRIVE_SYNC_VERIFICATION_INTERVAL
        value: "24"

databases:
  - name: miele-staging-db
    plan: free
    databaseName: miele_staging
    user: miele_staging
    region: oregon
