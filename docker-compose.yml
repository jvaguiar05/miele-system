services:
  db:
    image: postgres:16-alpine
    container_name: miele_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: miele_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miele_web
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      # apenas reforços/overrides seguros (sem segredos hardcoded)
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-core.settings.prod}
      PORT: ${PORT:-8000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "python backend/manage.py migrate &&
             gunicorn core.wsgi:application --chdir backend --bind 0.0.0.0:8000 --workers 3 --timeout 120 --access-logfile -"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8000/health/live || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30

  # Perfil alternativo para desenvolvimento (hot-reload)
  # Rode: docker compose --profile dev up -d web-dev
  web-dev:
    profiles: [ "dev" ]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miele_web_dev
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.dev
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "python backend/manage.py migrate &&
             python backend/manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8000/health/live || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
